plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.example.boombee.wear'
    compileSdk 36

    defaultConfig {
        applicationId "com.filipgolovic.boombee"
        minSdk 30
        targetSdk 36
        versionCode 24
        versionName "2.9.6"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
    }
}

dependencies {
    implementation project(':core')

    implementation platform('androidx.compose:compose-bom:2026.06.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    implementation 'androidx.activity:activity-compose:1.12.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.10.0'

    implementation 'androidx.wear.compose:compose-material:1.6.2'
    implementation 'androidx.wear.compose:compose-foundation:1.6.2'
    implementation 'androidx.wear:wear-tooling-preview:1.0.0'
    implementation 'com.google.android.gms:play-services-wearable:18.1.0'

    // Ambient Mode: keeps the timer screen itself visible (dimmed) instead
    // of handing off to the watch face when idle, so raising the wrist
    // un-dims straight back to the current round/time.
    implementation 'androidx.wear:wear:1.3.0'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'

    // Ongoing Activity: a live, system-rendered round/countdown status
    // surfaced on the watch face itself while the app isn't open. 1.0.0
    // kept OngoingActivityStatus/TimerPart package-private; 1.1.0 is the
    // first stable release that actually exposes them.
    implementation 'androidx.wear:wear-ongoing:1.1.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
}
